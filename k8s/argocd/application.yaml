apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smallbiz-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # ⚠️ 2026-04 사이클에서는 이 값이 placeholder였다. ArgoCD helm 릴리스는
    #    deployed였지만 Application은 존재하지 않는 저장소를 가리키고 있었으므로
    #    동기화가 한 번도 일어나지 않았다. README 검증 수준 표의 "설치만"이 이 뜻이다.
    repoURL: https://github.com/byeongkicho/smallbiz-cloud-platform.git
    targetRevision: main
    path: k8s/app

  destination:
    server: https://kubernetes.default.svc
    namespace: smallbiz

  syncPolicy:
    automated:
      prune: true      # Git에서 삭제하면 클러스터에서도 삭제
      selfHeal: true   # 누가 수동으로 바꾸면 자동 복구
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
