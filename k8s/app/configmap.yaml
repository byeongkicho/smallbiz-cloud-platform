apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: smallbiz
data:
  # RDS 엔드포인트는 apply 때마다 달라지므로 값을 박아두지 않는다.
  #   terraform -chdir=../../terraform output -raw rds_endpoint
  # 로 얻어 치환하거나, ArgoCD를 쓸 때는 kustomize/helm 값으로 주입한다.
  # (2026-04 사이클의 실제 엔드포인트가 여기 하드코딩돼 있었다 — 그 인스턴스는
  #  destroy됐고, 죽은 호스트명을 public 저장소에 남겨둘 이유가 없다.)
  DB_HOST: "REPLACE_ME.ap-northeast-2.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "appdb"
