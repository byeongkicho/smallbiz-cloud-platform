apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallbiz-app
  namespace: smallbiz
  labels:
    app: smallbiz-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smallbiz-app
  template:
    metadata:
      labels:
        app: smallbiz-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            # ⚠️ optional: true — 의도된 선택이지 방치가 아니다.
            #
            # secret.yaml 은 gitignore 라 원격 저장소에 없다. 이게 없으면 ArgoCD 가
            # 동기화해도 파드가 CreateContainerConfigError 로 멈춘다(GitOps 왕복이 깨진다).
            #
            # 대가: 시크릿 이름을 오타내도 **조용히 통과**한다. 지금은 이 앱(nginx)이
            #       이 값을 실제로 읽지 않으므로 감수한다 — kind 실측(2026-08-18)에서
            #       Secret 없이 2/2 Running + Ingress 정상 응답 확인.
            # 🔴 걷어낼 시점: 앱이 DB_PASSWORD 를 실제로 읽기 시작하는 커밋.
            #    그 순간부터 이건 "설정 누락이 조용히 통과하고 런타임에 터지는" 조합이 된다.
            # 제대로 된 해법: External Secrets Operator 가 AWS Secrets Manager 에서
            #    IRSA 로 당겨오는 것. 이 클러스터엔 IRSA 가 이미 있어 붙일 자리가 있다.
            - secretRef:
                name: app-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: app-html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-html
          configMap:
            name: app-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-html
  namespace: smallbiz
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SmallBiz Platform</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
          color: #e2e8f0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .container {
          text-align: center;
          padding: 3rem;
          background: rgba(255,255,255,0.05);
          border-radius: 1rem;
          border: 1px solid rgba(255,255,255,0.1);
          max-width: 600px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .emoji { font-size: 4rem; margin-bottom: 1.5rem; }
        .stack {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
          justify-content: center;
          margin-top: 1.5rem;
        }
        .badge {
          background: rgba(99,102,241,0.2);
          border: 1px solid rgba(99,102,241,0.4);
          padding: 0.25rem 0.75rem;
          border-radius: 9999px;
          font-size: 0.85rem;
        }
        .status { color: #4ade80; margin-top: 1.5rem; }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #64748b; }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="emoji">🏢</div>
        <h1>SmallBiz Platform</h1>
        <p>소규모 기업을 위한 클라우드 인프라 플랫폼</p>
        <div class="stack">
          <span class="badge">EKS 1.31</span>
          <span class="badge">Terraform</span>
          <span class="badge">ArgoCD</span>
          <span class="badge">ALB Ingress</span>
          <span class="badge">RDS MySQL</span>
          <span class="badge">GitOps</span>
        </div>
        <p class="status">✅ All systems operational</p>
        <p class="footer">Built by Byeongki Cho | AWS Portfolio Project</p>
      </div>
    </body>
    </html>
