name: Terraform Validate

# PR-time format and validation check.
# No AWS credentials required — local-only checks (fmt + init -backend=false + validate).
# 실제 계정을 상대로 도는 plan은 terraform-plan.yaml에 분리돼 있다 (OIDC + 원격 state).
# 이쪽은 자격증명이 없어 fork PR에서도 돌고, 문법 오류를 가장 싸게 잡는 층이다.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yaml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # 로컬(1.5.7)과 동일하게 고정. "1.x"는 CI가 매번 최신을 받아
          # 로컬과 다른 버전으로 검증하게 만든다 — 스큐의 원인.
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Validate sub-modules
        run: |
          set -e
          for module in modules/*/; do
            echo "=== Validating $module ==="
            (cd "$module" && terraform init -backend=false && terraform validate)
          done

      # 부트스트랩 계층은 루트와 state가 분리돼 있어 위 init/validate에 잡히지 않는다.
      # 여기서 빠뜨리면 IAM 신뢰 정책의 문법 오류가 apply 시점까지 안 보인다.
      - name: Validate bootstrap layer
        run: |
          set -e
          cd bootstrap
          terraform init -backend=false
          terraform validate

      # ──────────────────────────────────────────────────────────
      # checkov 정적 분석 — soft-fail
      #
      # 잡을 실패시키지 않는다. checkov 기본 정책은 엔터프라이즈 프로덕션
      # 기준이라 PoC 저장소에 그대로 적용하면 CI가 상시 빨강이 되고,
      # 상시 빨강인 게이트는 아무도 보지 않는다 — 신호가 죽는다.
      # 대신 결과를 잡 요약에 게시해 "변화"가 눈에 띄게 한다.
      # 무엇을 고쳤고 무엇을 왜 남겼는지는 docs/security-baseline.md.
      #
      # 서드파티 액션을 쓰지 않는다(terraform-plan.yaml과 같은 방침).
      # ──────────────────────────────────────────────────────────
      - name: Checkov (static analysis, soft-fail)
        id: checkov
        working-directory: .
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check checkov
          # --soft-fail: 지적이 있어도 종료코드 0
          checkov -d terraform --framework terraform --compact --soft-fail \
            | tee checkov.txt

      - name: Publish checkov summary
        if: always()
        working-directory: .
        run: |
          {
            echo '## Checkov'
            echo
            if [ -f checkov.txt ]; then
              grep -E 'Passed checks:|Failed checks:|Skipped checks:' checkov.txt || true
              echo
              echo '<details><summary>전체 출력</summary>'
              echo
              echo '```'
              head -c 400000 checkov.txt
              echo '```'
              echo
              echo '</details>'
            else
              echo '(checkov 출력 없음 — 앞 스텝이 실패했다)'
            fi
            echo
            echo '고친 것과 의도적으로 남긴 것: [`docs/security-baseline.md`](docs/security-baseline.md)'
          } >> "$GITHUB_STEP_SUMMARY"
