name: Terraform Plan

# PR마다 실제 AWS 계정을 상대로 `terraform plan`을 돌려 결과를 잡 요약에 게시한다.
#
# 자격증명은 OIDC로만 받는다 — 저장소에 장기 액세스 키가 없다.
# 수임하는 역할은 읽기 + state 잠금만 가능하고 apply 권한이 없다.
# 역할·신뢰 정책의 정의는 terraform/bootstrap/ 참조.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yaml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급에 필요. 이것 없이는 역할 수임이 불가능하다.

# 같은 브랜치에서 plan이 겹치면 state 잠금을 서로 기다리다 타임아웃난다.
concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  # 로컬(1.5.7)과 같은 버전에 고정. "1.x"로 두면 CI가 로컬보다 앞선 버전을 받아
  # state 포맷·문법 차이로 "로컬에선 되는데 CI에선 안 되는" 스큐가 생긴다.
  TF_VERSION: "1.5.7"

jobs:
  plan:
    name: plan (OIDC · read-only role)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 역할 ARN에는 AWS 계정 번호가 들어 있어 저장소에 커밋하지 않는다.
      # 시크릿이라기보다 노출을 줄이는 위생 조치다 — 이 역할은 sub 조건으로
      # 이 저장소에만 묶여 있어 ARN을 알아도 외부에서 수임할 수 없다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ github.run_id }}

      # 어떤 주체로 붙었는지 로그에 남긴다. 실패했을 때 "역할을 못 받은 것"과
      # "권한이 모자란 것"을 구분하는 첫 번째 단서가 된다.
      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (remote backend)
        run: terraform init -input=false

      - name: Terraform Plan
        env:
          # plan 전용 역할에는 apply 권한이 없으므로 이 값으로 RDS가 만들어질
          # 경로가 존재하지 않는다. 진짜 비밀번호를 CI에 둘 이유가 없다.
          TF_VAR_db_password: "ci-plan-only-never-applied"
        run: |
          # 🔴 pipefail이 없으면 파이프의 종료코드가 tee의 0으로 덮여
          # plan이 실패해도 잡이 초록으로 뜬다. 다른 저장소에서 이 정확한 버그로
          # 헬스체크가 6주간 "성공"을 기록한 적이 있다.
          set -euo pipefail
          terraform plan -no-color -input=false -lock-timeout=120s | tee plan.txt

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform Plan'
            echo
            echo "커밋 \`${GITHUB_SHA:0:7}\` · 리전 \`${AWS_REGION}\` · Terraform \`${TF_VERSION}\`"
            echo
            echo '```hcl'
            # 잡 요약은 1MB 상한이 있다. 계획이 비정상적으로 커져도 잘리기만 하고
            # 스텝이 실패하지는 않게 앞부분만 싣는다.
            head -c 900000 plan.txt || echo '(plan 출력 없음 — 앞 스텝이 실패했다)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
